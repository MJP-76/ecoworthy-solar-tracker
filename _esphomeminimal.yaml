---
substitutions:
  devicename: espHome Minimal
  deviceid: esphomeminimal

esphome:
  name: ${deviceid}

esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2
#  manual_ip:
#    static_ip: 172.16.1.x
#    gateway: 172.16.1.254
#    subnet: 255.255.255.0

captive_portal:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP

switch:
  - platform: restart
    name: Restart
