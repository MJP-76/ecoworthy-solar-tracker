---
substitutions:
  devicename: esphome
  deviceid: esphome
  staticip: 192.168.1.xxx
  buttongpio: GPIO13
  relaygpio: GPIO15
  blueledgpio: GPIO02

esphome:
  name: ${deviceid}
  platform: ESP8266
  board: esp8285

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP Address

switch:
  - platform: restart
    name: ${devicename} Restart

binary_sensor:
  - platform: status
    name: ${devicename} Status

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime
