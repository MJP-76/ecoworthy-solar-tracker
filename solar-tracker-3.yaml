# ECO-WORTHY Dual-Axis Solar Tracker - ESPHome Bridge
# For Wemos D1 Mini Pro connected to STC15 pin 17 (IR receiver pad)
# Requires custom STC15 firmware from:
#   https://github.com/jtubb/ecoworthy-solar-tracker
#
# Wiring:
#   D1 Mini Pro 5V  -> Tracker Pad 3 (+)
#   D1 Mini Pro GND -> Tracker Pad 4 (-)
#   D1 Mini Pro TX (GPIO1) + RX (GPIO3) soldered together
#   10kΩ pull-up from TX+RX junction to 3.3V
#   TX+RX junction -> Tracker Pin 17 (IR receiver signal leg)
#   GND common between all boards
#
# secrets.yaml must contain:
#   wifi_ssid: "YourSSID"
#   wifi_password: "YourPassword"
#   api_key: "base64..."
#   ota_password: "your_ota_password"
#   mesh_psk: "at_least_16_chars"

substitutions:
  device_name: solar-tracker-3
  friendly_name: Solar Tracker 1

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - delay: 5s
    - lambda: |-
        ESP_LOGI("boot", "Boot delay complete, tracker_bridge starting");

esp8266:
  board: d1_mini_pro

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ota_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

web_server:
  port: 80
  include_internal: true
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

external_components:
  - source:
      type: local
      path: /config/esphome/components
    components: [tracker_bridge]

uart:
  id: uart_bus
  rx_buffer_size: 512
  baud_rate: 9600
  tx_pin: GPIO1
  rx_pin: GPIO3

tracker_bridge:
  id: bridge
  uart_id: uart_bus
  mesh:
    channel: 6
    psk: !secret mesh_psk
    has_wind_sensor: true
    peers: []

# --- Sensors / status -------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "$friendly_name WiFi Signal"
    update_interval: 60s
  - platform: tracker_bridge
    tracker_bridge_id: bridge
    az:
      name: "$friendly_name Azimuth %"
    el:
      name: "$friendly_name Elevation %"
    wind:
      name: "$friendly_name Wind"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "$friendly_name IP Address"
  - platform: version
    name: "$friendly_name ESPHome Version"
  - platform: tracker_bridge
    tracker_bridge_id: bridge
    mode:
      name: "$friendly_name Mode"

# --- Command buttons --------------------------------------------------
button:
  - platform: tracker_bridge
    tracker_bridge_id: bridge
    force_park: { name: "$friendly_name Force Park" }
    force_release: { name: "$friendly_name Force Release" }
    stop: { name: "$friendly_name Emergency Stop" }
    calibrate: { name: "$friendly_name Calibrate" }
  - platform: template
    name: "$friendly_name Jog North"
    icon: mdi:arrow-up-bold
    on_press:
      - lambda: |-
          id(bridge).send_command("!jog ax=0 dir=+ ms=2000");
  - platform: template
    name: "$friendly_name Jog South"
    icon: mdi:arrow-down-bold
    on_press:
      - lambda: |-
          id(bridge).send_command("!jog ax=0 dir=- ms=2000");
  - platform: template
    name: "$friendly_name Jog East"
    icon: mdi:arrow-right-bold
    on_press:
      - lambda: |-
          id(bridge).write_str_frame_("!jog ax=1 dir=+ ms=2000");
  - platform: template
    name: "$friendly_name Jog West"
    icon: mdi:arrow-left-bold
    on_press:
      - lambda: |-
          id(bridge).write_str_frame_("!jog ax=1 dir=- ms=2000");

# --- Config sliders ---------------------------------------------------
number:
  - platform: tracker_bridge
    tracker_bridge_id: bridge
    wind_storm_mps:
      name: "$friendly_name Wind Storm"
      min_value: 5
      max_value: 30
      step: 1
    wind_release_mps:
      name: "$friendly_name Wind Release"
      min_value: 0
      max_value: 20
      step: 1
    storm_dwell_min:
      name: "$friendly_name Storm Dwell"
      min_value: 1
      max_value: 60
      step: 1
    track_thresh:
      name: "$friendly_name Track Threshold"
      min_value: 1
      max_value: 99
      step: 1
    night_park_enable:
      name: "$friendly_name Night Park Enable"
      min_value: 0
      max_value: 1
      step: 1
    night_park_az_pct:
      name: "$friendly_name Night Park East"
      min_value: 0
      max_value: 100
      step: 1
    night_park_el_pct:
      name: "$friendly_name Night Park Tilt"
      min_value: 0
      max_value: 100
      step: 1
    night_park_dark_min:
      name: "$friendly_name Night Park Dark Minutes"
      min_value: 1
      max_value: 120
      step: 1
    night_park_dark_thr:
      name: "$friendly_name Night Park Dark Threshold"
      min_value: 5
      max_value: 200
      step: 1

# --- Diagnostic switches -----------------------------------------------
switch:
  - platform: template
    name: "$friendly_name Test Offline"
    id: test_offline_switch
    optimistic: true
    entity_category: diagnostic
    icon: mdi:test-tube
    turn_on_action:
      - lambda: id(bridge).set_test_offline(true);
    turn_off_action:
      - lambda: id(bridge).set_test_offline(false);
  - platform: template
    name: "$friendly_name Sim Dark"
    id: sim_dark_switch
    optimistic: true
    entity_category: diagnostic
    icon: mdi:weather-night
    turn_on_action:
      - lambda: id(bridge).night_park_set_sim_dark(true);
    turn_off_action:
      - lambda: id(bridge).night_park_set_sim_dark(false);
  - platform: template
    name: "$friendly_name Resume Tracking"
    id: resume_tracking_switch
    optimistic: true
    entity_category: diagnostic
    icon: mdi:play
    turn_on_action:
      - lambda: id(bridge).enter_track_mode();
      - delay: 500ms
      - switch.turn_off: resume_tracking_switch
    turn_off_action:
      - lambda: ;

# --- Debug: runtime baud-rate select (leave at 9600 unless debugging) --
select:
  - id: change_baud_rate
    name: "Baud rate"
    platform: template
    options:
      - "1200"
      - "2400"
      - "4800"
      - "9600"
      - "38400"
      - "57600"
      - "115200"
      - "256000"
      - "512000"
      - "921600"
    initial_option: "9600"
    optimistic: true
    restore_value: True
    internal: false
    entity_category: config
    icon: mdi:swap-horizontal
    set_action:
      - lambda: |-
          id(uart_bus).flush();
          uint32_t new_baud_rate = stoi(x);
          ESP_LOGD("change_baud_rate", "Baud %u -> %u", id(uart_bus).get_baud_rate(), new_baud_rate);
          if (id(uart_bus).get_baud_rate() != new_baud_rate) {
            id(uart_bus).set_baud_rate(new_baud_rate);
            id(uart_bus).load_settings();
          }
