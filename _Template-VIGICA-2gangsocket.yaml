---
substitutions:
  devicename: Wallsocket 001
  deviceid: wallsocket001
#  staticip: 192.168.1.xx
  button1: GPIO00
  relay1gpio: GPIO12
#  led1: GPIO13
  button2: GPIO09
  relay2gpio: GPIO05
#  led2: GPIO13

#GPIO00	Button1
#GPIO01	User
#GPIO02	User
#GPIO03	User
#GPIO04	User
#GPIO05	Relay2
#GPIO09	Button2
#GPIO10	User
#GPIO12	Relay1
#GPIO13	User
#GPIO14	User
#GPIO15	User
#GPIO16	User
#FLAG	Analog


esphome:
  name: ${deviceid}
  platform: ESP8266
  board: esp01_1m

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP Address

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    name: ${devicename} Switch1
    pin: ${relay1gpio}
    id: ${deviceid}_relay1
#    on_turn_on:
#      - switch.toggle: ${deviceid}_ledblue
#      - switch.toggle: ${deviceid}_ledred
#    on_turn_off:
#      - switch.toggle: ${deviceid}_ledblue
#      - switch.toggle: ${deviceid}_ledred
  - platform: gpio
    name: ${devicename} Switch2
    pin: ${relay2gpio}
    id: ${deviceid}_relay2
#    on_turn_on:
#      - switch.toggle: ${deviceid}_led1
#    on_turn_off:
#      - switch.toggle: ${deviceid}_led2

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    pin: ${button1}
    id: ${deviceid}_button1
    on_press:
      - switch.toggle: ${deviceid}_relay1

  - platform: gpio
    pin: ${button2}
    id: ${deviceid}_button2
    on_press:
      - switch.toggle: ${deviceid}_relay2

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime
