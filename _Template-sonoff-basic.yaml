---
substitutions:
  devicename: SONOFF Basic
  deviceid: sonoffbasic
  staticip: 192.168.1.xx
  buttongpio: GPIO0
  relaygpio: GPIO12
  greenledgpio: GPIO13
  sensorgpio: GPIO14

esphome:
  name: $deviceid
  platform: ESP8266
  board: esp01_1m
  board_flash_mode: dout
  on_boot:
    priority: 600
    then:
      - switch.turn_off: ${deviceid}_switch
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    pin: ${relaygpio}
    name: ${devicename} Switch
    id: ${deviceid}_switch
    on_turn_on:
      - output.turn_on: ${deviceid}_greenled
    on_turn_off:
      - output.turn_off: ${deviceid}_greenled

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch

output:
  - platform: gpio
    pin: ${greenledgpio}
    id: ${deviceid}_greenled
    inverted: True
