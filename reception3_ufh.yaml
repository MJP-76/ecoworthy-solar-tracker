---
substitutions:
  devicename: Reception3 UFH
  deviceid: reception3ufh

esphome:
  name: ${deviceid}
esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

binary_sensor:
  - platform: status
    name: Status

tuya:
  time_id: homeassistant_time

climate:
  - platform: tuya
    name: "${devicename}"
    switch_datapoint: 1
    target_temperature_datapoint: 2
    current_temperature_datapoint: 102
#    eco_datapoint: 5
#    eco_temperature: 16 °C
    temperature_multiplier: 0.5
    visual:
      min_temperature: 15 °C
      max_temperature: 23 °C
      temperature_step: 0.5 °C

sensor:
  - platform: wifi_signal
    name: "${devicename} WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "${devicename} Uptime"
  - platform: "tuya"
    name: "${devicename} Target Temp"
    sensor_datapoint: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.5
  - platform: "tuya"
    name: "${devicename} Room Temp"
    sensor_datapoint: 3
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.5
  - platform: "tuya"
    name: "${devicename} Floor Temp"
    sensor_datapoint: 102
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.5
  - platform: "tuya"
    name: "${devicename} Mode"
    sensor_datapoint: 4
    internal: true

switch:
  - platform: restart
    name: "${devicename} Restart"
  - platform: "tuya"
    name: "${devicename} Power"
    id: power_switch
    switch_datapoint: 1
  - platform: "tuya"
    name: "${devicename} ECO Mode"
    icon: "mdi:earth"
    switch_datapoint: 5
  - platform: "tuya"
    name: "${devicename} Child Lock"
    icon: "mdi:lock"
    switch_datapoint: 6
  - platform: "tuya"
    name: "${devicename} DP 104"
    switch_datapoint: 104
    internal: true
