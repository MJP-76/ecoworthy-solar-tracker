---
substitutions:
  devicename: SONOFF TH16
  deviceid: sonoffth16
  staticip: 192.168.1.66
  buttongpio: GPIO0
  relaygpio: GPIO12
  blueledgpio: GPIO13
  sensorgpio: GPIO14

esphome:
  name: $deviceid
  platform: ESP8266
  board: esp01_1m
  board_flash_mode: dout
  on_boot:
    priority: 600
    then:
      - switch.turn_off: ${deviceid}_switch
      - output.turn_off: ${deviceid}_blueled
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP

output:
  - platform: esp8266_pwm
    id: ${deviceid}_blueled
    pin:
      number: ${blueledgpio}
      inverted: True

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    pin: ${relaygpio}
    name: ${devicename} Switch
    id:  ${deviceid}_switch
  - platform: gpio
    name: ${devicename} Power LED
    pin: GPIO13
    inverted: True
    restore_mode: ALWAYS_ON
    id: ${deviceid}_powerled

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime
# Built in sensor
#  - platform: dht
#    model: AM2302
#    pin: ${sensorgpio}
#    humidity:
#      name: ${devicename} Humidity
#    temperature:
#      name: ${devicename} Temperature
#    update_interval: 10s

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch
