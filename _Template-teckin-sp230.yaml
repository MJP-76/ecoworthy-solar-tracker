---
substitutions:
  devicename: TECKIN SP23
  deviceid: teckinsp23plug
  staticip: 192.168.1.xxx
  buttongpio: GPIO13
  relaygpio: GPIO15
  blueledgpio: GPIO02

esphome:
  name: ${deviceid}
  platform: ESP8266
  board: esp8285
  on_boot:
    priority: 600
    then:
      - switch.turn_on: ${deviceid}_switch
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP Address


switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    pin: ${relaygpio}
    name: ${devicename} Switch
    id: ${deviceid}_switch
    on_turn_on:
      - output.turn_on: ${deviceid}_blueled
    on_turn_off:
      - output.turn_off: ${deviceid}_blueled

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime
  - platform: hlw8012
    sel_pin:
      number: GPIO12
      inverted: True
    cf_pin: GPIO05
    cf1_pin: GPIO14
    # Higher value gives lower watt readout
    current_resistor: 0.00221
    # Lower value gives lower voltage readout
    voltage_divider: 871
    current:
      name: ${devicename} Amperage
      unit_of_measurement: A
    voltage:
      name: ${devicename} Voltage
      unit_of_measurement: V
    power:
      name: ${devicename} Wattage
      unit_of_measurement: W
      state_class: measurement
      id: teckin_001_wattage
    change_mode_every: 8
    update_interval: 10s
  - platform: total_daily_energy
    name: ${devicename} Total Daily Energy
    power_id: teckin_001_wattage
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh
    state_class: total
    device_class: energy

output:
  - platform: gpio
    pin: ${blueledgpio}
    id: ${deviceid}_blueled
    inverted: True
