---
substitutions:
  devicename: CRYPTOShed02
  deviceid: cryptoshed02
  button1: GPIO00
  relay1gpio: GPIO12
  led1: GPIO13
  button2: GPIO09
  relay2gpio: GPIO05
  led2: GPIO13

esphome:
  name: ${deviceid}
  on_boot:
    then:
      - switch.turn_off: ${deviceid}_relay1
      - switch.turn_off: ${deviceid}_relay2
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_relay1
      - switch.turn_off: ${deviceid}_relay2
esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:

api:
  reboot_timeout: 30min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    name: Switch1
    pin: ${relay1gpio}
    id: ${deviceid}_relay1
  - platform: gpio
    name: Switch2
    pin: ${relay2gpio}
    id: ${deviceid}_relay2

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    pin: ${button1}
    id: ${deviceid}_button1
    on_press:
      - switch.toggle: ${deviceid}_relay1

  - platform: gpio
    pin: ${button2}
    id: ${deviceid}_button2
    on_press:
      - switch.toggle: ${deviceid}_relay2

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
