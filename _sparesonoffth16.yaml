---
substitutions:
  devicename: Spare Sonoff TH16
  deviceid: sparesonoffth16

esphome:
  name: ${deviceid}

esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

switch:
  - platform: restart
    name: Restart

binary_sensor:
  - platform: status
    name: Status
