---
substitutions:
  devicename: Bedroom1 Extractor
  deviceid: bedroom1extractor
  buttongpio: GPIO0
  relaygpio: GPIO12
  greenledgpio: GPIO13
  sensorgpio: GPIO14

esphome:
  name: ${deviceid}
  on_boot:
    priority: -10
    then:
      - switch.turn_off: ${deviceid}_switch
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch
esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    pin: ${relaygpio}
    name: Switch
    id: ${deviceid}_switch
    on_turn_on:
      - output.turn_on: ${deviceid}_greenled
    on_turn_off:
      - output.turn_off: ${deviceid}_greenled

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch

output:
  - platform: gpio
    pin: ${greenledgpio}
    id: ${deviceid}_greenled
    inverted: True
