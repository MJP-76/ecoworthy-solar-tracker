---
substitutions:
  devicename: Bedroom1 Aircon
  deviceid: bedroom1aircon

esphome:
  name: ${deviceid}
  on_boot:
    then:
      - switch.turn_off: ${deviceid}_power
esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2
  power_save_mode: NONE

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: Button 1
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - light.turn_on:
            id: indicator_led
        - switch.turn_on: ${deviceid}_power
        - delay: 100ms
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    name: Button 2
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - light.turn_on:
            id: indicator_led
        - switch.turn_on: ${deviceid}_mode
        - delay: 100ms
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    name: Button 3
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - light.turn_on:
            id: indicator_led
        - switch.turn_on: ${deviceid}_fan
        - delay: 100ms
  - platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
      inverted: true
    name: Button 4
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - light.turn_on:
            id: indicator_led
        - switch.turn_on: ${deviceid}_temp
        - delay: 100ms

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    name: Power
    pin: GPIO12
    id: ${deviceid}_power
  - platform: gpio
    name: Mode
    pin: GPIO5
    id: ${deviceid}_mode
  - platform: gpio
    name: Fan
    pin: GPIO4
    id: ${deviceid}_fan
  - platform: gpio
    name: Temp
    pin: GPIO15
    id: ${deviceid}_temp

output:
  - platform: esp8266_pwm
    id: blue_led
    pin: GPIO13
    inverted: true

light:
  - platform: monochromatic
    name: Blue LED
    id: indicator_led
    output: blue_led
