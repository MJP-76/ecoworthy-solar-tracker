---
substitutions:
  devicename: Hyleton 313 Plug
  deviceid: hyleton313plug
  staticip: 192.168.1.xx
  relaygpio: GPIO15
  blueledgpio: GPIO02
  redledgpio: GPIO0
  buttongpio: GPIO13

esphome:
  name: ${deviceid}
  platform: ESP8266
  board: esp01_1m

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP Address

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    name: ${devicename} Button
    pin: ${relaygpio}
    id: ${deviceid}_relay
    on_turn_on:
      - switch.toggle: ${deviceid}_ledblue
      - switch.toggle: ${deviceid}_ledred
    on_turn_off:
      - switch.toggle: ${deviceid}_ledblue
      - switch.toggle: ${deviceid}_ledred
  - platform: gpio
    name: ${devicename} Red LED
    pin: ${redledgpio}
    inverted: True
    restore_mode: ALWAYS_ON
    id: ${deviceid}_ledred
  - platform: gpio
    name: ${devicename} Blue LED
    pin: ${blueledgpio}
    inverted: True
    restore_mode: ALWAYS_OFF
    id: ${deviceid}_ledblue

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_relay
