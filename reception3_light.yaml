---
substitutions:
  devicename: Reception3 Light
  deviceid: reception3light
  buttongpio: GPIO0
  relaygpio: GPIO12
  blueledgpio: GPIO13
  swgpio: GPIO4

esphome:
  name: ${deviceid}
  on_boot:
    priority: 600
    then:
#      - light.turn_on: ${deviceid}_light #Use when no physical switch connected
      - light.turn_off: ${deviceid}_light #Use physical switch connected
  on_shutdown:
    then:
      - light.turn_off: ${deviceid}_light
esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP

light:
  - platform: binary
    name: ${devicename}
    id: ${deviceid}_light
    output: ${deviceid}_relay
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    name: ${deviceid}_blueled
    output: ${deviceid}_blueled

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    name: Switch
    icon: "mdi:lightbulb_outline"
    pin:
      number: ${relaygpio}
      allow_other_uses: true
    id: ${deviceid}_switch
    restore_mode: restore_default_off

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

output:
  - platform: gpio
    pin:
      number: ${relaygpio}
      allow_other_uses: true
    id: ${deviceid}_relay
  - platform: esp8266_pwm
    pin:
      number: ${blueledgpio}
      allow_other_uses: true
    id: ${deviceid}_blueled
    inverted: True

status_led:
  pin:
    number: ${blueledgpio}
    allow_other_uses: true
    inverted: True

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    name: Input
    pin: ${swgpio}
    id: ${deviceid}_input
    on_press:
      then:
        - switch.toggle:
            id: ${deviceid}_switch
    on_release:
      then:
        - switch.toggle:
            id: ${deviceid}_switch
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch
