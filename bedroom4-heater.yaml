---
substitutions:
  devicename: Bedroom4 Heater
  deviceid: bedroom4heater
  buttongpio: GPIO0
  relaygpio: GPIO12
  blueledgpio: GPIO13
  sensorgpio: GPIO14

esphome:
  name: ${deviceid}
  on_boot:
    then:
      - switch.turn_off: ${deviceid}_switch
      - output.turn_off: ${deviceid}_blueled
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch
esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP

output:
  - platform: esp8266_pwm
    id: ${deviceid}_blueled
    pin:
      number: ${blueledgpio}
      allow_other_uses: true
      inverted: True

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    pin: ${relaygpio}
    name: Switch
    id:  ${deviceid}_switch
  - platform: gpio
    name: Power LED
    pin:
      number: ${blueledgpio}
      allow_other_uses: true
    inverted: True
    restore_mode: ALWAYS_ON
    id: ${deviceid}_powerled

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
# Built in sensor
  - platform: dht
    model: AM2302
    pin: ${sensorgpio}
    humidity:
      name: Humidity
      filters:
        - round: 1
    temperature:
      name: Temperature
      filters:
        - round: 1
    update_interval: 60s

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch
