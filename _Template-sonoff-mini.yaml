---
substitutions:
  devicename: SONOFF Mini
  deviceid: sonoffmini
  buttongpio: GPIO0
  relaygpio: GPIO12
  blueledgpio: GPIO13
  swgpio: GPIO4

esphome:
  name: $deviceid
  platform: ESP8266
  board: esp01_1m
  board_flash_mode: dout
  on_boot:
    priority: 600 # turn off the light as early as possible
    then:
#      - light.turn_on: ${deviceid}_light #Use when no physical switch connected
      - light.turn_off: ${deviceid}_light #Use physical switch connected
  on_shutdown:
    then:
      - light.turn_off: ${deviceid}_light

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP

light:
  - platform: binary
    name: ${devicename}
    id: ${deviceid}_light
    output: ${deviceid}_relay
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    name: ${deviceid}_blueled
    output: ${deviceid}_blueled

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    name: ${devicename} Switch
    icon: "mdi:lightbulb_outline"
    pin: ${relaygpio}
    id: ${deviceid}_switch
    restore_mode: restore_default_off

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime

output:
  - platform: gpio
    pin: ${relaygpio}
    id: ${deviceid}_relay
  - platform: esp8266_pwm
    pin: ${blueledgpio}
    id: ${deviceid}_blueled
    inverted: True

status_led:
  pin:
    number: ${blueledgpio}
    inverted: True

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    name: ${devicename} Input
    pin: ${swgpio}
    id: ${deviceid}_input
    on_press:
      then:
        - switch.toggle:
            id: ${deviceid}_switch
    on_release:
      then:
        - switch.toggle:
            id: ${deviceid}_switch
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch
