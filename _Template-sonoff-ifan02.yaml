---
substitutions:
  devicename: SONOFF iFan02
  deviceid: sonoffifan02
  staticip: 192.168.1.xx
  lightrelay1gpio: GPIO12
  fanrelay1gpio: GPIO5
  fanrelay2gpio: GPIO4
  fanrelay3gpio: GPIO15

esphome:
  name: $deviceid
  platform: ESP8266
  board: esp01_1m
  on_boot:
    priority: 600
    then:
      - output.turn_off: ${deviceid}_light
  on_shutdown:
    then:
      - output.turn_off: ${deviceid}_light

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP

# Device Specific Config
light:
  - platform: binary
    name: ${devicename} Light
    output: ${deviceid}_light
    restore_mode: ALWAYS_OFF

output:
  - platform: gpio
    pin: GPIO12
    id: ${deviceid}_light

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    name: ${devicename} Relay3
    pin: GPIO4
    id: ${deviceid}_fan3sw
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    name: ${devicename} Relay2
    pin: GPIO5
    id: ${deviceid}_fan2sw
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    name: ${devicename} Relay4
    pin: GPIO15
    id: ${deviceid}_fan4sw
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: template
    name: ${devicename} Low
    id: ${deviceid}_fanlow
    turn_on_action:
      - switch.turn_off: ${deviceid}_fanmed
      - switch.turn_off: ${deviceid}_fanhigh
      - switch.turn_on: ${deviceid}_fan2sw
  - platform: template
    name: ${devicename} Medium
    id: ${deviceid}_fanmed
    turn_on_action:
      - switch.turn_off: ${deviceid}_fanlow
      - switch.turn_off: ${deviceid}_fanhigh
      - switch.turn_on: ${deviceid}_fan2sw
      - switch.turn_on: ${deviceid}_fan3sw
  - platform: template
    name: ${devicename} High
    id: ${deviceid}_fanhigh
    turn_on_action:
      - switch.turn_off: ${deviceid}_fanlow
      - switch.turn_off: ${deviceid}_fanmed
      - switch.turn_on: ${deviceid}_fan2sw
      - switch.turn_on: ${deviceid}_fan4sw
  - platform: template
    name: ${devicename} Off
    id: ${deviceid}_fanoff
    turn_on_action:
      - switch.turn_off: ${deviceid}_fan2sw
      - switch.turn_off: ${deviceid}_fan4sw
      - switch.turn_off: ${deviceid}_fan3sw
