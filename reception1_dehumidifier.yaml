---
substitutions:
  devicename: Reception1 Dehumidifier
  deviceid: reception1dehumidifier
  buttongpio: GPIO13
  relaygpio: GPIO15
  blueledgpio: GPIO02

esphome:
  name: ${deviceid}
  on_boot:
    then:
      - switch.turn_off: ${deviceid}_switch
esp8266:
  board: esp8285

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address


switch:
  - platform: restart
    name: Restart
  - platform: gpio
    pin: ${relaygpio}
    name: Switch
    id: ${deviceid}_switch
    on_turn_on:
      - output.turn_on: ${deviceid}_blueled
    on_turn_off:
      - output.turn_off: ${deviceid}_blueled

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  - platform: hlw8012
    sel_pin:
      number: GPIO12
      inverted: True
    cf_pin: GPIO05
    cf1_pin: GPIO14
    # Higher value gives lower watt readout
    current_resistor: 0.00221
    # Lower value gives lower voltage readout
    voltage_divider: 871
    current:
      name: Amperage
      unit_of_measurement: A
    voltage:
      name: Voltage
      unit_of_measurement: V
    power:
      name: Power
      unit_of_measurement: W
      state_class: measurement
      id: ${deviceid}_power
    change_mode_every: 8
    update_interval: 10s
  - platform: total_daily_energy
    name: Total Daily Energy
    power_id: ${deviceid}_power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh
    state_class: total
    device_class: energy

output:
  - platform: gpio
    pin: ${blueledgpio}
    id: ${deviceid}_blueled
    inverted: True

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch
