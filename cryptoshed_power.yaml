---
substitutions:
  devicename: CRYPTOShed
  deviceid: cryptoshed
  buttongpio: GPIO0
  relaygpio: GPIO12
  blueledgpio: GPIO13

esphome:
  name: ${deviceid}
  on_boot:
    then:
      - switch.turn_on: ${deviceid}_switch
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch
esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

logger:
  baud_rate: 0

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

api:
  reboot_timeout: 30min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    inverted: true
    pin: ${relaygpio}
    name: Switch
    id: ${deviceid}_switch
    on_turn_on:
      - output.turn_on: ${deviceid}_blueled
    on_turn_off:
      - output.turn_off: ${deviceid}_blueled

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  - platform: cse7766
    current:
      name: Amperage
      unit_of_measurement: A
      filters:
        - throttle_average: 10s
    voltage:
      name: Voltage
      unit_of_measurement: V
      filters:
        - throttle_average: 10s
    power:
      name: Power
      unit_of_measurement: W
        state_class: measurement
      filters:
        - throttle_average: 10s
      id: ${deviceid}_power
  - platform: total_daily_energy
    name: Total Daily Energy
    power_id: ${deviceid}_power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh
      state_class: total
    device_class: energy

output:
  - platform: gpio
    pin: ${blueledgpio}
    id: ${deviceid}_blueled
    inverted: True

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch
