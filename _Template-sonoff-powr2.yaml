---
substitutions:
  devicename: SONOFF POWR2
  deviceid: sonoffpowr2
  staticip: 192.168.1.xx
  buttongpio: GPIO0
  relaygpio: GPIO12
  blueledgpio: GPIO13

esphome:
  name: $deviceid
  platform: ESP8266
  board: esp01_1m
  board_flash_mode: dout
  on_boot:
    priority: 600
    then:
      - switch.turn_off: ${deviceid}_switch
  on_shutdown:
    then:
      - switch.turn_off: ${deviceid}_switch

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}_Hotspot
    password: !secret ap_password
  fast_connect: true
  min_auth_mode: WPA2
  domain: !secret domain
#  manual_ip:
#    static_ip: $staticip
#    gateway: 192.168.1.254
#    subnet: 255.255.255.0

captive_portal:

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${devicename} IP

uart:
  rx_pin: RX
  baud_rate: 4800

switch:
  - platform: restart
    name: ${devicename} Restart
  - platform: gpio
    pin: ${relaygpio}
    name: ${devicename} Switch
    id: ${deviceid}_switch
    on_turn_on:
      - output.turn_on: ${deviceid}_blueled
    on_turn_off:
      - output.turn_off: ${deviceid}_blueled

sensor:
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: ${devicename} Uptime
  - platform: cse7766
    current:
      name: ${devicename} Amperage
      unit_of_measurement: A
    voltage:
      name: ${devicename} Voltage
      unit_of_measurement: V
    power:
      name: ${devicename} Power
      unit_of_measurement: W
      state_class: measurement
      id: ${deviceid}_power
    update_interval: 10s
  - platform: total_daily_energy
    name: ${devicename} Total Daily Energy
    power_id: ${deviceid}_power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh
    state_class: total
    device_class: energy

binary_sensor:
  - platform: status
    name: ${devicename} Status
  - platform: gpio
    pin: ${buttongpio}
    id: ${deviceid}_button
    on_press:
      - switch.toggle: ${deviceid}_switch

output:
  - platform: gpio
    pin: ${blueledgpio}
    id: ${deviceid}_blueled
    inverted: True
