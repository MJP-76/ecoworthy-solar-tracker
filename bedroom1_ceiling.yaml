---


substitutions:
  devicename: Bedroom1
  deviceid: bedroom1

esphome:
  name: ${deviceid}
  includes:
    - ifan02.h
  on_boot:
    priority: 600
    # turn off the light as early as possible
    then:
      - light.turn_on: ifan02_light
      - switch.turn_off: fan2sw
      - switch.turn_off: fan3sw
      - switch.turn_off: fan4sw

esp8266:
  board: esp01_1m
  restore_from_flash: true

logger:

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${deviceid}_AP
    password: !secret ap_password
  domain: !secret domain
  fast_connect: true
  min_auth_mode: WPA2

captive_portal:

web_server:
  auth:
    username: admin
    password: !secret web_server_password

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: Connected SSID

sensor:
  - platform: wifi_signal
    update_interval: 10s
    id: wifi_signal_db
  - platform: uptime
    name: Uptime
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    state_class: measurement
  - platform: adc
    pin: VCC
    name: "VCC Voltage"

output:
  - platform: gpio
    pin: GPIO12
    id: llightrelay
  - platform: template
    type: float
    id: fan_decode
    write_action:
      - lambda: |-
          if (state < 0.25) {
            id(fan2sw).turn_off();
            id(fan3sw).turn_off();
            id(fan4sw).turn_off();
          }
          else if (state < 0.5) {
            id(fan2sw).turn_on();
            id(fan3sw).turn_off();
            id(fan4sw).turn_off();
          }
          else if (state < 0.75) {
            id(fan2sw).turn_on();
            id(fan3sw).turn_on();
            id(fan4sw).turn_off();
          }
          else {
            id(fan2sw).turn_on();
            id(fan3sw).turn_off();
            id(fan4sw).turn_on();
          }

light:
  - platform: binary
    name: Light Switch
    output: llightrelay
    restore_mode: RESTORE_DEFAULT_OFF
    id: ifan02_light

switch:
  - platform: restart
    name: Restart
  - platform: gpio
    name: "Fan 3 Relay"
    pin: GPIO4
    id: fan3sw
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
  - platform: gpio
    name: "Fan 2 Relay"
    pin: GPIO5
    id: fan2sw
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
  - platform: gpio
    name: "Fan 4 Relay"
    pin: GPIO15
    id: fan4sw
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

fan:
  - platform: speed
    output: fan_decode
    name: "Fan"
    icon: mdi:fan
    restore_mode: RESTORE_DEFAULT_OFF
    speed_count: 3
    id: ifan02_fan
